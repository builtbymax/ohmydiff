name: GitButler compatibility

# `but --json` has no versioned schema. Run the contract tests against the latest GitButler daily
# and on every change, and open an issue when a release breaks them.
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["**.md", ".github/assets/**", "LICENSE"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# Only the report job can write issues; the jobs that run code from the repository and GitButler cannot.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contract:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Cloning the tree-sitter grammars takes about two minutes, against seconds for the tests.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            OhMyDiffCore/.build/repositories
            OhMyDiffCore/.build/checkouts
          key: spm-${{ runner.os }}-${{ hashFiles('OhMyDiffCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install the latest GitButler
        run: |
          brew install --cask gitbutler
          xattr -dr com.apple.quarantine /Applications/GitButler.app || true
          mkdir -p "$HOME/.local/bin"
          ln -sf /Applications/GitButler.app/Contents/MacOS/gitbutler-tauri "$HOME/.local/bin/but"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          but --version
          swift --version

      - name: Contract tests
        id: contract
        working-directory: OhMyDiffCore
        env:
          OHMYDIFF_REQUIRE_BUT: "1"
          OHMYDIFF_COMPAT_REPORT: ${{ runner.temp }}/compat-report.json
        run: swift test --filter 'ButContract|ButCompatibility|ButLive|ButStatus|GitButler' 2>&1 | tee "$RUNNER_TEMP/contract.log"

      - name: Compare with the known-good version
        run: scripts/but-compat.sh check

      - name: Keep the failure for the report job
        if: failure() && steps.contract.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/compat"
          but --version > "$RUNNER_TEMP/compat/but-version.txt"
          cp "$RUNNER_TEMP/contract.log" "$RUNNER_TEMP/compat/"
          [ -f "$RUNNER_TEMP/compat-report.json" ] && cp "$RUNNER_TEMP/compat-report.json" "$RUNNER_TEMP/compat/" || true

      - name: Upload the failure
        if: failure() && steps.contract.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-failure
          path: ${{ runner.temp }}/compat
          retention-days: 7

  report:
    needs: contract
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the failure
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compat-failure
          path: ${{ runner.temp }}/compat

      # Without the artifact the contract tests passed and a later step failed: nothing to report.
      - name: Open an issue
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export OHMYDIFF_BUT_VERSION="$(cat "$RUNNER_TEMP/compat/but-version.txt")"
          scripts/but-compat.sh issue "$RUNNER_TEMP/compat/compat-report.json" "$RUNNER_TEMP/compat/contract.log"
